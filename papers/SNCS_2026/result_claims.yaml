# Machine-readable headline-result verification map (Stage 5).
#
# Complements docs/claim_evidence_registry.yaml (repository-wide, all
# research threads) and EVIDENCE_MAP.md (human-readable, this manuscript's
# scoped view) with the exact filter/aggregation logic used to reproduce
# each headline number in manuscript/main.tex, so a reviewer can
# re-verify a number without re-deriving the pandas computation from
# prose. Every entry here was independently recomputed during Stage 4/5
# (see RESULTS_CROSS_CHECK.md for the full narrative); this file is the
# compact index, not a replacement for that narrative.
#
# Field meanings:
#   manuscript_location   \label target(s) in manuscript/main.tex where
#                          the value appears
#   source_artifact       exact repo-relative CSV/report path
#   filter                pandas-style filter applied to the source CSV
#   aggregation            aggregation function applied after filtering
#   reproduced_value       value obtained this stage
#   prior_value            value stated in papers/JDIQ_2026 (the earlier,
#                          separately-submitted manuscript), if different
#   verification_status    exact_match | recomputed_discrepancy
#   notes                  free text

