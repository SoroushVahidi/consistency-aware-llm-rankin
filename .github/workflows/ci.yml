# NOTE (2026-07-31): these two jobs are hand-maintained but are also
# faithfully mirrored, command-by-command, by scripts/run_cloud_validation.py
# (`--tier core` / `--tier solver`), the canonical local/cloud validation
# entry point used while this workflow cannot run at all due to a GitHub
# account billing issue (see docs/PROJECT_STATUS.md / docs/EXPERIMENTS.md
# "Cloud Validation"). Not yet refactored to call that script directly from
# here -- doing so without being able to verify it on a live runner (billing
# is currently blocking every run) would be an untested change to a
# previously-working, unmodified workflow; keep both in sync manually until
# a live run can confirm the refactor. If you change one, check the other.
name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    # Lightweight job: does NOT install the [exact] (PySCIPOpt/SCIP) extra, so
    # the 16 solver-dependent tests are expected to skip here. This job exists
    # for fast lint/non-solver feedback only. The solver-enabled job below
    # (`tests-solver-enabled`) is the one that must show zero solver skips --
    # do not rely on this job's skip count to mean "everything ran".
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ".[dev,llm]"

      - name: Check architecture boundaries (no circular subpackage dependencies)
        run: python scripts/check_architecture_boundaries.py

      - name: Check active path portability
        run: python scripts/check_active_portability.py

      - name: Run tests (non-solver; SCIP tests expected to skip in this job)
        run: pytest

  tests-solver-enabled:
    # Required job: installs the [exact] extra so the SCIP-dependent tests
    # actually run instead of silently skipping. This is the job that
    # enforces the canonical solver version and must show 0 skipped tests.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies (incl. [exact] solver extra)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ".[dev,exact,llm]"
          # Free-tier gurobipy: no license/credentials needed for the tiny
          # graphs in test_legacy_gurobi_backend_matches_scip_objective; lets
          # that optional/never-required legacy-backend test actually run
          # instead of skipping, so this job can show a literal 0 skipped.
          pip install gurobipy

      - name: Report installed SCIP / PySCIPOpt versions
        run: |
          python -c "
          import pyscipopt
          print('PySCIPOpt version:', pyscipopt.__version__)
          print('Underlying SCIP version:', pyscipopt.Model().version())
          "

      - name: Verify canonical solver version (fails visibly on mismatch)
        run: make verify-env

      - name: Run full suite and require zero skipped tests
        run: make test-full
