# Claim-to-Evidence Registry
#
# Machine-readable index of this repository's major claims. See
# docs/CONTRIBUTIONS.md for the human-readable narrative version of the same
# information (that document is authoritative for prose explanation; this
# file is authoritative for structured, checkable fields).
#
# Schema (all fields required unless noted):
#   id                    stable, unique identifier ("<AREA>-<NN>")
#   claim                 one-sentence statement of the claim
#   status                canonical | negative_result | exploratory | internal_validation | superseded
#   canonical             true if this is evidence the current JDIQ manuscript actually cites
#   manuscript_applicable true if suitable for citation in papers/JDIQ_2026 double-blind material
#   implementation_paths  [repo-relative paths to the code implementing the claim]
#   generating_scripts    [repo-relative paths to the script(s) that produced the evidence]
#   evidence_paths        [repo-relative paths to the report/output backing the claim]
#   statistical_unit      what the n in any reported CI/p-value actually counts over
#   correction_method     multiple-comparison correction used, or "none" / "n/a"
#   sample_size           short description of n (queries, datasets, seeds, etc.)
#   limitations           [short strings]
#   superseded_by         [claim ids that superseded this one], or [] if none
#   notes                 optional free text

