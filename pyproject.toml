[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "consistency-ranker"
version = "0.1.0"
description = "Consistency-aware retrieval and reasoning in LLM systems using combinatorial optimisation (MWFAS)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Soroush Vahidi" }]
keywords = ["llm", "ranking", "feedback-arc-set", "consistency", "pairwise-preferences"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "networkx>=3.2",
    "numpy>=1.26",
    "scipy>=1.11",
    "tqdm>=4.66",
    "datasets>=2.18",
    "huggingface-hub>=0.21",
    "matplotlib>=3.8",
    "pandas>=2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.3",
]
bm25 = [
    "rank-bm25>=0.2.2",
]
notebook = [
    "jupyter>=1.0",
    "seaborn>=0.13",
]

[project.scripts]
run-synthetic = "scripts.run_synthetic:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
