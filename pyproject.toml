[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "consistency-ranker"
version = "0.1.0"
description = "Consistency-aware retrieval and reasoning in LLM systems using combinatorial optimisation (MWFAS)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Soroush Vahidi" }]
keywords = ["llm", "ranking", "feedback-arc-set", "consistency", "pairwise-preferences"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "networkx>=3.2",
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "tqdm>=4.66",
    "datasets>=2.18,<4.0",
    "huggingface-hub>=0.21",
    "sentence-transformers>=5.3.0",
    "matplotlib>=3.8",
    "pandas>=2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.3",
]
# TREC DL passage (MS MARCO–based) and Robust04 export via scripts/download_datasets.py
ir = [
    "ir-datasets>=0.5.5",
]
bm25 = [
    "rank-bm25>=0.2.2",
]
dense = [
    # NOTE: sentence-transformers is already an unconditional core dependency
    # (>=5.3.0 above) as of this repository's current state; this extra's
    # floor is kept aligned with that (not left at the historical >=2.2.0,
    # which conflicted with the core requirement and was never actually
    # installable as a looser version once the core deps were resolved).
    "sentence-transformers>=5.3.0",
]
notebook = [
    "jupyter>=1.0",
    "seaborn>=0.13",
]
llm = [
    "openai>=1.60.0",
    "google-genai>=1.3.0",
    "cohere>=5.0.0",
]
# Exact MWFAS solver (free, open-source, no license required):
# pip install "consistency-ranker[exact]"
# Pinned to the EXACT version every tracked exact-repair canonical result
# (reports/exact_open_source_ilp_repair_investigation/,
# reports/final_revision_task4_exact_baseline_fairness_20260715/) was
# generated with -- recovered 2026-07-30 (repo Stage 4) from 3 independent
# ENVIRONMENT_pip_freeze.txt files. See
# src/consistency_ranker/mwfas_solver.py's verify_canonical_solver_version()
# for a runtime check with a documented override for exploratory use.
exact = [
    "PySCIPOpt==6.2.1",
]

[project.scripts]
run-synthetic = "scripts.run_synthetic:main"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["consistency_ranker*", "rerankers*", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
# Experiment orchestration scripts are tabular and intentionally dense.
"scripts/run_policy_selection_experiment.py" = ["E501"]
"scripts/run_real_query_policy_replay.py" = ["E501"]
"tests/test_policy_selection.py" = ["E501"]
"tests/test_real_query_policy_replay.py" = ["E501"]
"src/consistency_ranker/policy_selection/*.py" = ["E501"]
"src/consistency_ranker/real_query_replay/*.py" = ["E501"]
